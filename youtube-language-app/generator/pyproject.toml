[project]
name = "ytlang"
version = "0.1.0"
description = "Turn a YouTube video into a language-learning deck (sentences, timestamps, translations, notes)"
requires-python = ">=3.10"
dependencies = [
  "youtube-transcript-api>=1.0",
  "wordfreq>=3.0",
  "anthropic>=1.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ytlang = "ytlang.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ytlang*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
