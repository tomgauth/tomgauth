<title>Tableau de bord</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800&display=swap');
:root {

  --ink: #f3edda; --muted: #a79dc9; --gold: #f2c14e; --gold2: #b8862a; --green: #6fcf7a; --green2: #3f9a53;
  --red: #e8625e; --blue: #6cb4f0; --orange: #f08a4b; --pink: #e493c7; --teal: #5ad1c5;
  --bar-bg: #120f1c; --shadow: rgba(0,0,0,.45);
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #efe4cc; --bg2: #e6d8bb; --panel: #fbf3e2; --panel2: #f1e6cf; --line: #8b7355; --line2: #b9a07a;
  --ink: #2a2233; --muted: #6e6180; --gold: #c58d12; --gold2: #8d6208; --green: #3d9a4f; --green2: #2b7a3c;
  --red: #c9453f; --blue: #2f7fc6; --orange: #d26a2a; --pink: #b85a9c; --teal: #1f9d92;
  --bar-bg: #e2d4b6; --shadow: rgba(60,40,20,.25);
} }
:root[data-theme="light"] {
  --bg: #efe4cc; --bg2: #e6d8bb; --panel: #fbf3e2; --panel2: #f1e6cf; --line: #8b7355; --line2: #b9a07a;
  --ink: #2a2233; --muted: #6e6180; --gold: #c58d12; --gold2: #8d6208; --green: #3d9a4f; --green2: #2b7a3c;
  --red: #c9453f; --blue: #2f7fc6; --orange: #d26a2a; --pink: #b85a9c; --teal: #1f9d92;
  --bar-bg: #e2d4b6; --shadow: rgba(60,40,20,.25);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

.px { font-family: 'Press Start 2P', monospace; letter-spacing: 0; }

/* ---------- bandeau + village ---------- */
.topbar { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; padding: 12px clamp(12px, 2vw, 24px); background: var(--bg2); border-bottom: 3px solid var(--line); }

.topbar .tb-mid { text-align: center; min-width: 0; }
.topbar h1 { margin: 0; font-size: clamp(13px, 1.7vw, 19px); color: var(--gold); line-height: 1.3; }
.topbar p { margin: 6px auto 0; font-size: 13.5px; color: var(--ink); max-width: 640px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .tb-right { text-align: right; }

.legend { background: var(--panel); border-bottom: 3px solid var(--line); padding: 10px clamp(12px, 2vw, 24px); font-size: 13.5px; line-height: 1.45; min-height: 46px; }
.legend b { color: var(--gold); }
.legend .hint { opacity: .75; font-size: 12px; }
@media (max-width: 760px) { .topbar { grid-template-columns: 1fr auto; } .topbar .tb-mid { grid-column: 1 / -1; order: 3; } .topbar p { white-space: normal; } .topbar .qday { display: none; } .topbar .wx small { display: none; } .legend { font-size: 12px; } }

/* ---------- layout ---------- */
.wrap { max-width: 1320px; margin: 0 auto; padding: 18px 16px 48px; }
.row { display: grid; gap: 16px; }
.row.quests { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.row.grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 16px; }
@media (max-width: 1020px) { .row.quests { grid-template-columns: 1fr; } }
@media (max-width: 760px) { .row.grid4 { grid-template-columns: 1fr; } }

.panel { background: var(--panel); border: 3px solid var(--line); border-radius: 2px; box-shadow: 0 4px 0 var(--shadow), inset 0 0 0 2px var(--bg2); padding: 14px 14px 12px; position: relative; min-width: 0; }
.panel::before { content: ''; position: absolute; left: -3px; top: -3px; width: 10px; height: 10px; border-right: 3px solid var(--gold2); border-bottom: 3px solid var(--gold2); background: var(--line); }
.panel::after { content: ''; position: absolute; right: -3px; top: -3px; width: 10px; height: 10px; border-left: 3px solid var(--gold2); border-bottom: 3px solid var(--gold2); background: var(--line); }

.panel .lead { color: var(--muted); font-size: 13px; margin: 0 0 10px; }

/* quests */
.quest { padding: 9px 0 8px; border-top: 2px dashed var(--line); }

.quest .qh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.quest .qn { font-weight: 800; font-size: 14.5px; display: flex; gap: 8px; align-items: center; }
.quest .qn .ic { font-size: 16px; width: 22px; text-align: center; }
.quest .qv { font-size: 11px; color: var(--ink); white-space: nowrap; }
.quest .qv small { color: var(--muted); font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 700; }
.quest .qs { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.quest .qs b { color: var(--ink); font-weight: 700; }
.quest.clickable { cursor: pointer; }
.quest.clickable:hover .qn { color: var(--gold); }
.bar { position: relative; height: 14px; background: var(--bar-bg); border: 2px solid var(--line); margin-top: 6px; overflow: hidden; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green); background-image: repeating-linear-gradient(90deg, transparent 0 6px, rgba(0,0,0,.18) 6px 8px); transition: width .6s ease; }
.bar > i.gold { background-color: var(--gold); } .bar > i.blue { background-color: var(--blue); } .bar > i.red { background-color: var(--red); } .bar > i.orange { background-color: var(--orange); } .bar > i.pink { background-color: var(--pink); } .bar > i.teal { background-color: var(--teal); }
.bar > .pace { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .85; }
.bar > .pace::after { content: ''; position: absolute; top: -4px; left: -3px; border: 4px solid transparent; border-top-color: var(--ink); }
.bar.thin { height: 10px; }
.steps { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.steps li { display: flex; gap: 8px; align-items: baseline; }
.steps .st { width: 14px; height: 14px; border: 2px solid var(--line); flex: none; position: relative; top: 2px; }
.steps .st.ok { background: var(--green); border-color: var(--green2); } .steps .st.wait { background: var(--gold); } .steps .st.todo { background: transparent; }
.steps .muted { color: var(--muted); }
.hidden { display: none; }
.tag { display: inline-block; font-size: 10.5px; padding: 1px 6px; border: 1.5px solid var(--line2); border-radius: 3px; color: var(--muted); margin-left: 4px; vertical-align: middle; font-weight: 700; }

/* tasks */
.tasks { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 5px; font-size: 13.5px; }
.tasks li { display: grid; grid-template-columns: 16px 46px 1fr auto; gap: 8px; align-items: baseline; }
.tasks .cb { width: 14px; height: 14px; border: 2px solid var(--line2); position: relative; top: 2px; }
.tasks .cb.done { background: var(--green); border-color: var(--green2); }
.tasks .t { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tasks .p1 { border-color: var(--red); } .tasks .p2 { border-color: var(--orange); } .tasks .p3 { border-color: var(--blue); }
.tasks .dur { font-size: 11px; color: var(--muted); }
.tasks li.done .c { text-decoration: line-through; color: var(--muted); }
.mit { background: var(--panel2); border: 2px solid var(--line); padding: 8px 10px; font-size: 13px; white-space: pre-line; margin: 8px 0 4px; }
.mit b { color: var(--gold); font-size: 11px; display: block; margin-bottom: 4px; }

/* stats */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin: 8px 0 10px; }
.kpi { background: var(--panel2); border: 2px solid var(--line); padding: 8px 8px 6px; }
.kpi .v { font-size: 15px; color: var(--ink); } .kpi .v.big { font-size: 20px; }
.kpi .l { font-size: 11px; color: var(--muted); margin-top: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.kpi .d { font-size: 11.5px; margin-top: 2px; } .up { color: var(--green); } .down { color: var(--red); } .flat { color: var(--muted); }
svg.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: 'Nunito', sans-serif; font-size: 10px; fill: var(--muted); }
.acc { display: grid; gap: 6px; margin-top: 8px; }
.acc .a { display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 13px; align-items: baseline; }
.acc .a small { color: var(--muted); font-size: 11.5px; }
.acc .a .amt { font-size: 12px; }
.cats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; font-size: 12.5px; margin-top: 8px; }
.cats div { display: flex; justify-content: space-between; gap: 8px; } .cats span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.rules { margin: 10px 0 0; padding: 0 0 0 16px; font-size: 12.5px; color: var(--muted); }
.ag { list-style: none; margin: 6px 0 0; padding: 0; font-size: 13.5px; display: grid; gap: 3px; }
.ag .day { font-size: 11px; color: var(--gold); margin-top: 8px; text-transform: capitalize; }
.ag li.ev { display: grid; grid-template-columns: 44px 1fr; gap: 8px; } .ag .h { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.ag li.ev.past { opacity: .5; }
.fc { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 8px 0 6px; text-align: center; font-size: 11px; }
.fc div { background: var(--panel2); border: 2px solid var(--line); padding: 5px 2px; } .fc .d { color: var(--muted); font-weight: 700; } .fc .i { font-size: 16px; line-height: 1.3; } .fc .t { font-variant-numeric: tabular-nums; }
.foot { margin-top: 20px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.foot .btn { background: var(--panel2); color: var(--ink); border: 2px solid var(--line); padding: 5px 10px; font-size: 12px; font-weight: 700; }
.foot .btn:hover { border-color: var(--gold); }
.live { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.live span { border: 1.5px solid var(--line); padding: 1px 6px; border-radius: 3px; } .live span.on { border-color: var(--green); color: var(--green); } .live span.err { border-color: var(--red); color: var(--red); }
.note { font-size: 12px; color: var(--muted); margin-top: 8px; }
.review { margin-top: 10px; font-size: 12.5px; color: var(--muted); border-top: 2px dashed var(--line); padding-top: 8px; }
.review b { color: var(--ink); }
details summary { cursor: pointer; font-weight: 700; color: var(--ink); font-size: 13px; }
</style>

<div class="topbar">
  <div class="tb-left"><div class="clock px" id="clock">--:--</div><div class="date" id="date"></div></div>
  <div class="tb-mid"><h1 class="px" id="greet"></h1><p id="focus"></p></div>
  <div class="tb-right"><div class="wx px" id="wx">…</div><div class="qday" id="qday"></div></div>
</div>

<div class="wrap">
  <div class="row quests">
    <section class="panel" id="p-quarter"></section>
    <section class="panel" id="p-week"></section>
    <section class="panel" id="p-day"></section>
  </div>

    <div>Snapshot : <span id="gen"></span> · <span class="live" id="live"></span></div>

  </div>
  <div class="note" id="credits">Données : Coda (Daily Form, Weekly, Daily Review, All Money 2026, Income), Todoist, Google Calendar, Open-Meteo. Mise à jour automatique toutes les 24 h quand la page est ouverte dans Claude avec les connecteurs.</div>
</div>

<script>
const D = /*__DATA__*/{};
const LAT = 52.52, LON = 13.405, TZ = 'Europe/Berlin';
const QSTART = (D.kpi_live && D.kpi_live.quarter && D.kpi_live.quarter.start) || '2026-09-01';
const QEND = (D.kpi_live && D.kpi_live.quarter && D.kpi_live.quarter.end) || '2026-11-30';
const BUDGET = 2500; const WORK_TARGET = 20;
const S = Object.assign({daily: [], reviews: [], weeks: [], todoist: [], calendar: [], money: {monthly: {}, recent: []}, income: [], productivity: {}, balances: {accounts: [], rules: [], perso_blocks: []}, kpi_live: {}, capberlin: {steps: []}, weather: null}, D);

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const fmtNum = (n, d = 0) => n == null || isNaN(n) ? '–' : Number(n).toLocaleString('fr-FR', {minimumFractionDigits: d, maximumFractionDigits: d});
const eur = n => n == null ? '–' : fmtNum(Math.round(n)) + ' €';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const avg = arr => { const v = arr.filter(x => typeof x === 'number' && !isNaN(x)); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const sum = arr => arr.filter(x => typeof x === 'number' && !isNaN(x)).reduce((a, b) => a + b, 0);
function berlinNow() {
  const now = new Date();
  const parts = new Intl.DateTimeFormat('en-GB', {timeZone: TZ, hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false, year: 'numeric', month: 'numeric', day: 'numeric'}).formatToParts(now);
  const o = {}; for (const p of parts) o[p.type] = p.value;
  const h = typeof window.FORCE_HOUR === 'number' ? window.FORCE_HOUR : (+o.hour % 24) + (+o.minute) / 60 + (+o.second) / 3600;
  const asUTC = Date.UTC(+o.year, +o.month - 1, +o.day, +o.hour % 24, +o.minute, +o.second);
  return {h, offset: Math.round((asUTC - now.getTime()) / 36e5), date: `${o.year}-${pad(o.month)}-${pad(o.day)}`, now};
}
function sunTimes(dateISO, offsetH) {
  const d = new Date(dateISO + 'T12:00:00Z'); const n = Math.floor((d - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5); const toRad = Math.PI / 180;
  const calc = rising => { const lngHour = LON / 15, t = n + ((rising ? 6 : 18) - lngHour) / 24; const Mn = (0.9856 * t) - 3.289;
    let L = Mn + (1.916 * Math.sin(Mn * toRad)) + (0.020 * Math.sin(2 * Mn * toRad)) + 282.634; L = (L + 360) % 360;
    let RA = Math.atan(0.91764 * Math.tan(L * toRad)) / toRad; RA = (RA + 360) % 360; RA += (Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90); RA /= 15;
    const sinDec = 0.39782 * Math.sin(L * toRad), cosDec = Math.cos(Math.asin(sinDec));
    const cosH = (Math.cos(90.833 * toRad) - (sinDec * Math.sin(LAT * toRad))) / (cosDec * Math.cos(LAT * toRad)); if (cosH > 1 || cosH < -1) return null;
    let H = rising ? 360 - Math.acos(cosH) / toRad : Math.acos(cosH) / toRad; H /= 15; const T = H + RA - (0.06571 * t) - 6.622; return (((T - lngHour) % 24) + 24 + offsetH) % 24; };
  return {rise: calc(true), set: calc(false)};
}
const todayISO = () => (typeof window.FORCE_DATE === 'string') ? window.FORCE_DATE : berlinNow().date;
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 864e5);
const isoDow = iso => { const d = new Date(iso + 'T00:00:00Z').getUTCDay(); return d === 0 ? 7 : d; };
const weekStart = iso => addDays(iso, 1 - isoDow(iso));
const isoWeek = iso => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + 4 - isoDow(iso)); const y0 = new Date(Date.UTC(d.getUTCFullYear(), 0, 1)); return Math.ceil(((d - y0) / 864e5 + 1) / 7); };
const fmtDay = (iso, opts) => new Date(iso + 'T12:00:00Z').toLocaleDateString('fr-FR', Object.assign({timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long'}, opts || {}));
const fmtShort = iso => new Date(iso + 'T12:00:00Z').toLocaleDateString('fr-FR', {timeZone: 'UTC', day: 'numeric', month: 'short'});
const WX = {0: ['☀️', 'Ciel clair'], 1: ['🌤️', 'Plutôt clair'], 2: ['⛅', 'Partiellement nuageux'], 3: ['☁️', 'Couvert'], 45: ['🌫️', 'Brouillard'], 48: ['🌫️', 'Brouillard givrant'], 51: ['🌦️', 'Bruine légère'], 53: ['🌦️', 'Bruine'], 55: ['🌧️', 'Bruine dense'], 61: ['🌧️', 'Pluie légère'], 63: ['🌧️', 'Pluie'], 65: ['🌧️', 'Pluie forte'], 71: ['🌨️', 'Neige légère'], 73: ['🌨️', 'Neige'], 75: ['❄️', 'Neige forte'], 80: ['🌦️', 'Averses'], 81: ['🌧️', 'Averses'], 82: ['⛈️', 'Averses violentes'], 95: ['⛈️', 'Orage'], 96: ['⛈️', 'Orage et grêle'], 99: ['⛈️', 'Orage et grêle']};
const wx = code => WX[code] || WX[3];

/* ---------- model ---------- */
const M = {};
function deriveModel() {
  const today = todayISO(); M.today = today;
  const daily = S.daily.filter(d => d.date && d.date <= today).sort((a, b) => a.date < b.date ? -1 : 1); M.daily = daily;
  const last = n => daily.filter(d => d.date > addDays(today, -n));
  const prev = (n, m) => daily.filter(d => d.date > addDays(today, -n - m) && d.date <= addDays(today, -n));
  M.d7 = last(7); M.p7 = prev(7, 7); M.d14 = last(14); M.d30 = last(30);
  const sc = d => { const parts = []; if (d.happy != null) parts.push([d.happy / 10, .4]); if (d.stab != null) parts.push([d.stab / 10, .25]); if (d.anx != null) parts.push([1 - d.anx / 10, .2]); if (d.energy != null) parts.push([d.energy / 10, .15]); const w = sum(parts.map(p => p[1])); return w ? sum(parts.map(p => p[0] * p[1])) / w : null; };
  const ms = M.d14.map(sc).filter(x => x != null); M.mental = ms.length ? avg(ms) : .6;
  M.happy7 = avg(M.d7.map(d => d.happy)); M.happyP7 = avg(M.p7.map(d => d.happy));
  M.energy7 = avg(M.d7.map(d => d.energy)); M.stab7 = avg(M.d7.map(d => d.stab)); M.anx7 = avg(M.d7.map(d => d.anx));
  M.sleep7 = avg(M.d7.map(d => d.sleeph)); M.sleepq7 = avg(M.d7.map(d => d.sleepq)); M.steps7 = avg(M.d7.map(d => d.steps));
  M.social7 = avg(M.d7.map(d => d.social)); M.socialEv = M.d7.filter(d => d.socialev).length; M.friends7 = M.d7.filter(d => d.friendstalk).length;
  M.lifestyle7 = avg(M.d7.map(d => d.lifestyle));
  // food
  M.foodq7 = avg(M.d7.map(d => d.foodq)); M.protein7 = avg(M.d7.map(d => d.protein)); M.proteinT = avg(M.d14.map(d => d.proteint)) || 140;
  M.kcalin7 = avg(M.d7.map(d => d.kcalin)); M.kcalout7 = avg(M.d7.map(d => d.kcalout)); M.drinks7 = sum(M.d7.map(d => d.drinks)); M.coffee7 = avg(M.d7.map(d => d.coffee));
  M.nonvegan7 = M.d7.filter(d => d.nonvegan).length; M.fasting7 = avg(M.d7.map(d => d.fasting)); M.calai7 = avg(M.d7.map(d => d.calai));
  // week
  M.wkStart = weekStart(today); M.wkEnd = addDays(M.wkStart, 6); M.wkNum = isoWeek(today); M.wkDay = isoDow(today);

function lineChart(series, opts) {
