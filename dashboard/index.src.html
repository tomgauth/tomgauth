<style>

/* ---------- bandeau + village ---------- */

.topbar .tb-mid { text-align: center; min-width: 0; }
.topbar h1 { margin: 0; font-size: clamp(13px, 1.7vw, 19px); color: var(--gold); line-height: 1.3; }
.topbar p { margin: 6px auto 0; font-size: 13.5px; color: var(--ink); max-width: 640px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.topbar .upd { margin-top: 8px; background: var(--panel2); color: var(--gold); border: 2px solid var(--gold2); box-shadow: 0 3px 0 var(--shadow); padding: 5px 10px; font: 10px/1.2 'Press Start 2P', monospace; }
.topbar .upd:hover { border-color: var(--gold); } .topbar .upd:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); } .topbar .upd:disabled { opacity: .6; cursor: wait; }
.panel h2 .mini { background: transparent; color: var(--gold); border: 1px solid var(--gold2); padding: 1px 6px; font: 700 11px 'Nunito', sans-serif; } .panel h2 .mini:disabled { opacity: .6; }
.topbar .sync { font-size: 11px; color: var(--muted); margin-top: 4px; font-weight: 700; }
.questbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; padding: 10px clamp(8px, 1.2vw, 16px); background: var(--bg2); border-bottom: 3px solid var(--line); }
.qchip { background: var(--panel); border: 2px solid var(--line); padding: 8px 10px 9px; display: grid; gap: 5px; min-width: 0; }
.qchip .k { font-size: 11px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .05em; display: flex; justify-content: space-between; gap: 6px; white-space: nowrap; overflow: hidden; }
.qchip .k b { color: var(--ink); text-transform: none; letter-spacing: 0; }
.qchip .v { font-size: 15px; line-height: 1; } .qchip .v small { font-size: 10px; color: var(--muted); }
.qchip.big { grid-column: span 2; border-color: var(--gold2); } .qchip.big .v { font-size: 22px; color: var(--gold); }
.qchip .bar { margin: 2px 2px 0; }
.pxi { display: inline-block; width: 16px; height: 16px; background-size: 16px 16px; image-rendering: pixelated; vertical-align: -3px; transform: scale(1.25); margin-right: 3px; }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(250px, 19vw); gap: 12px; padding: 12px clamp(8px, 1.2vw, 16px) 0; }
.stage .mid { min-width: 0; border: 3px solid var(--line); background: var(--panel); align-self: start; }
.stage .side { contain: size; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scrollbar-width: thin; padding: 3px 4px 6px 3px; }
.stage .side > .panel { flex-shrink: 0; }
@media (max-width: 1100px) { .topbar.slim { grid-template-columns: 1fr auto; } .topbar.slim .questbar { grid-column: 1 / -1; order: 3; justify-content: flex-start; } .stage { grid-template-columns: 1fr; } .stage .side { contain: none; overflow: visible; } .stage .mid { order: -1; } .qchip.big { grid-column: span 1; } }
.hero { position: relative; width: 100%; height: clamp(460px, calc(100vh - 150px), 1000px); overflow: hidden; background: #3c8a4a; }
.topbar.slim { grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; padding: 6px clamp(8px, 1.2vw, 16px); }
.topbar.slim .clock { font-size: 20px; } .topbar.slim .date { margin-top: 3px; font-size: 11.5px; }
.topbar.slim .tb-right { display: flex; align-items: center; gap: 10px; } .topbar.slim .wx { font-size: 15px; } .topbar.slim .wx small { display: none; } .topbar.slim .upd { margin-top: 0; } .topbar.slim .sync { display: none; }
.topbar.slim .questbar { display: flex; gap: 8px; padding: 0; background: none; border: 0; justify-content: center; flex-wrap: wrap; }
.topbar.slim .qchip { padding: 4px 8px 5px; gap: 2px; min-width: 120px; } .topbar.slim .qchip.big { min-width: 190px; }
.topbar.slim .qchip .v { font-size: 12px; } .topbar.slim .qchip.big .v { font-size: 14px; } .topbar.slim .qchip .bar { height: 8px; margin-top: 2px; }
.row.grid4b { grid-template-columns: repeat(4, minmax(0, 1fr)); } @media (max-width: 1200px) { .row.grid4b { grid-template-columns: repeat(2, minmax(0, 1fr)); } } @media (max-width: 760px) { .row.grid4b { grid-template-columns: 1fr; } }
.goal { padding: 7px 0; border-top: 2px dashed var(--line); } .goal:first-of-type { border-top: 0; }
.goal .gh { display: flex; justify-content: space-between; gap: 8px; font-weight: 800; font-size: 13.5px; align-items: center; } .goal .gh .px { font-size: 11px; color: var(--gold); }
.mits { list-style: none; margin: 4px 0 2px; padding: 0; font-size: 13px; line-height: 1.35; } .mits li { padding: 4px 0 4px 18px; position: relative; } .mits li::before { content: ''; position: absolute; left: 2px; top: 9px; width: 8px; height: 8px; background: var(--gold); box-shadow: 1px 1px 0 var(--shadow); }
.info { position: absolute; z-index: 5; width: 300px; max-width: calc(100% - 24px); background: rgba(24,18,36,.96); color: #f3edda; border: 3px solid #f2c14e; box-shadow: 0 4px 0 rgba(0,0,0,.45); padding: 10px 12px 11px; font-size: 13px; line-height: 1.45; }

.hidden { display: none !important; }

.lapse-cap small { display: block; margin-top: 6px; color: #f3edda; font-size: 9px; } .lapse-stop { position: absolute; right: 14px; bottom: 14px; z-index: 6; background: #241b33; color: #f2c14e; border: 3px solid #f2c14e; padding: 8px 12px; font: 11px 'Press Start 2P', monospace; }

.hero canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: pan-x pan-y; }
.timeline { background: var(--bg2); border-bottom: 3px solid var(--line); padding: 8px clamp(12px, 2vw, 24px) 10px; }
.timeline .tl-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.timeline .tl-title { font-size: 13px; color: var(--muted); } .timeline .tl-title b { color: var(--ink); }
.timeline .btn { background: var(--panel2); color: var(--ink); border: 2px solid var(--line); padding: 4px 9px; font-size: 12px; font-weight: 700; margin-left: 4px; }
.timeline .btn.on { border-color: var(--gold); color: var(--gold); } .timeline .btn:disabled { opacity: .45; cursor: default; }
.timeline .tl-months { position: relative; height: 14px; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 800; }
.timeline .tl-month { position: absolute; top: 0; border-left: 2px solid var(--line); padding-left: 5px; white-space: nowrap; overflow: hidden; }
.timeline .tl-strip { display: flex; gap: 1px; height: 18px; cursor: pointer; }
.timeline .tl-day { flex: 1; background: var(--line); opacity: .55; border-radius: 1px; transition: opacity .15s; }
.timeline .tl-day.m0 { background: #4e9c6a; } .timeline .tl-day.m1 { background: #d08a3a; } .timeline .tl-day.m2 { background: #6cb4f0; }
.timeline .tl-day.week { opacity: .95; } .timeline .tl-day.future { opacity: .22; } .timeline .tl-day:hover { opacity: 1; outline: 2px solid var(--ink); }
.timeline .tl-day.today { box-shadow: inset 0 -4px 0 var(--ink); opacity: 1; } .timeline .tl-day.sel { outline: 2px solid var(--gold); opacity: 1; }
.legend { background: var(--panel); border-bottom: 3px solid var(--line); padding: 10px clamp(12px, 2vw, 24px); font-size: 13.5px; line-height: 1.45; min-height: 46px; }
.legend b { color: var(--gold); }
.legend .hint { opacity: .75; font-size: 12px; }
@media (max-width: 760px) { .topbar { grid-template-columns: 1fr auto; } .topbar .tb-mid { grid-column: 1 / -1; order: 3; } .topbar p { white-space: normal; } .topbar .qday { display: none; } .topbar .wx small { display: none; } .legend { font-size: 12px; } }

/* ---------- layout ---------- */
.wrap { max-width: 1320px; margin: 0 auto; padding: 18px 16px 48px; }
.row { display: grid; gap: 16px; }
.row.quests { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.row.grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 16px; }
.row.grid3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 1020px) { .row.grid3 { grid-template-columns: 1fr; } }
@media (max-width: 1020px) { .row.quests { grid-template-columns: 1fr; } }
@media (max-width: 760px) { .row.grid4 { grid-template-columns: 1fr; } }

.panel { background: var(--panel); border: 3px solid var(--line); border-radius: 2px; box-shadow: 0 4px 0 var(--shadow), inset 0 0 0 2px var(--bg2); padding: 14px 14px 12px; position: relative; min-width: 0; }
.panel::before { content: ''; position: absolute; left: -3px; top: -3px; width: 10px; height: 10px; border-right: 3px solid var(--gold2); border-bottom: 3px solid var(--gold2); background: var(--line); }
.panel::after { content: ''; position: absolute; right: -3px; top: -3px; width: 10px; height: 10px; border-left: 3px solid var(--gold2); border-bottom: 3px solid var(--gold2); background: var(--line); }

.quest .qv { font-size: 11px; color: var(--ink); white-space: nowrap; }

.quest .qs { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.quest .qs b { color: var(--ink); font-weight: 700; }
.quest.clickable { cursor: pointer; }
.quest.clickable:hover .qn { color: var(--gold); }
.bar { position: relative; height: 14px; background: #241b33; border: 2px solid #120d1b; box-shadow: 0 0 0 2px #6b5a8a, inset 0 2px 0 rgba(0,0,0,.45); margin: 8px 2px 2px; overflow: hidden; image-rendering: pixelated; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green); background-image: linear-gradient(180deg, rgba(255,255,255,.38) 0 3px, transparent 3px 7px, rgba(0,0,0,.22) 7px), repeating-linear-gradient(90deg, transparent 0 7px, rgba(0,0,0,.28) 7px 9px); box-shadow: inset -2px 0 0 rgba(255,255,255,.35); transition: width .6s ease; }
.bar > i.gold { background-color: var(--gold); } .bar > i.blue { background-color: var(--blue); } .bar > i.red { background-color: var(--red); } .bar > i.orange { background-color: var(--orange); } .bar > i.pink { background-color: var(--pink); } .bar > i.teal { background-color: var(--teal); }
.bar > .pace { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .85; }

.bar.thin { height: 10px; }
.steps { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.steps li { display: flex; gap: 8px; align-items: baseline; }

.steps .st.ok { background: var(--green); border-color: var(--green2); } .steps .st.wait { background: var(--gold); } .steps .st.todo { background: transparent; }
.steps .muted { color: var(--muted); }
.hidden { display: none; }

.chart text { font-family: 'Nunito', sans-serif; font-size: 10px; fill: var(--muted); }
.acc { display: grid; gap: 6px; margin-top: 8px; }

.ag li.ev { display: grid; grid-template-columns: 44px 1fr; gap: 8px; } .ag .h { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

.fc { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 8px 0 6px; text-align: center; font-size: 11px; }
.fc div { background: var(--panel2); border: 2px solid var(--line); padding: 5px 2px; } .fc .d { color: var(--muted); font-weight: 700; } .fc .i { font-size: 16px; line-height: 1.3; } .fc .t { font-variant-numeric: tabular-nums; }

.foot .btn { background: var(--panel2); color: var(--ink); border: 2px solid var(--line); padding: 5px 10px; font-size: 12px; font-weight: 700; }
